apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: copilot

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: api-gateway
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3

labels:
  - includeSelectors: true
    pairs:
      env: dev
      managed-by: kustomize
