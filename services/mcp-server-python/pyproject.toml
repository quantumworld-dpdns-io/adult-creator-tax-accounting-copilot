[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-server-python"
version = "0.1.0"
description = "Model Context Protocol server for the Adult Creator Tax & Accounting Copilot"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "quantumworld-dpdns-io" }]
dependencies = [
    "fastmcp>=0.5.0",
    "pydantic>=2.7",
    "httpx>=0.27",
    "structlog>=24.1",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "prometheus-client>=0.20",
    "redis>=5.0",
    "aiokafka>=0.11",
    "pyjwt>=2.8",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "black>=24.10",
    "mypy>=1.11",
    "robotframework>=7.0",
    "robotframework-requests>=0.9.7",
]
quantum = [
    "qiskit>=1.2",
    "qiskit-aer>=0.14",
    "qiskit-ibm-runtime>=0.25",
    "cudaq>=0.9",
]
zk = ["noir-lang>=0.30", "risc0-zkvm>=1.0"]

[project.scripts]
mcp-server-python = "mcp_server_python.__main__:main"

[tool.setuptools.packages.find]
include = ["mcp_server_python*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "PT", "RUF"]
ignore = ["S101"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-v --cov=mcp_server_python --cov-report=term --cov-fail-under=80"
