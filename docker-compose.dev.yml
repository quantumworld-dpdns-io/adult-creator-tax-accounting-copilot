version: '3.9'

# Dev stack for the Adult Creator Tax & Accounting Copilot.
# Use: `docker compose -f docker-compose.dev.yml up -d`
# Includes: Postgres, Redis, Kafka, MinIO, Ollama, Qdrant, Milvus, Phoenix,
#           OpenObserve, Vault, Tetragon, NGINX, dev tools.

networks:
  copilot:
    driver: bridge

volumes:
  pgdata: {}
  redisdata: {}
  kafkadata: {}
  miniodata: {}
  ollamadata: {}
  qdrantdata: {}
  milvusdata: {}
  phoenixdata: {}
  vaultdata: {}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
      POSTGRES_DB: copilot
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    networks: [copilot]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "1gb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]
    networks: [copilot]

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.18.0
    command: ["dragonfly", "--logtostderr", "--proactor_threads=4"]
    ports: ["6399:6379"]
    networks: [copilot]

  kafka:
    image: bitnami/kafka:3.7
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports: ["9092:9092"]
    volumes: ["kafkadata:/bitnami/kafka"]
    networks: [copilot]

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
    networks: [copilot]

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollamadata:/root/.ollama"]
    networks: [copilot]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  vllm:
    image: vllm/vllm-openai:latest
    command: ["--model", "meta-llama/Meta-Llama-3.1-8B-Instruct", "--port", "8001"]
    ports: ["8001:8001"]
    networks: [copilot]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  sglang:
    image: lmsysorg/sglang:latest
    command: ["python3", "-m", "sglang.launch_server", "--model-path", "meta-llama/Meta-Llama-3.1-8B-Instruct", "--port", "8002"]
    ports: ["8002:8002"]
    networks: [copilot]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrantdata:/qdrant/storage"]
    networks: [copilot]

  milvus:
    image: milvusdb/milvus:v2.4.10
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: "etcd:2379"
      MINIO_ADDRESS: "minio:9000"
    ports: ["19530:19530", "9091:9091"]
    networks: [copilot]

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.13
    command: ["etcd", "-advertise-client-urls=http://etcd:2379", "-listen-client-urls", "http://0.0.0.0:2379", "--data-dir", "/etcd"]
    networks: [copilot]

  weaviate:
    image: semitechnologies/weaviate:1.27.0
    ports: ["8080:8080"]
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
    networks: [copilot]

  chroma:
    image: chromadb/chroma:latest
    ports: ["8000:8000"]
    networks: [copilot]

  phoenix:
    image: arizephoenix/phoenix:latest
    ports: ["6006:6006", "4317:4317"]
    volumes: ["phoenixdata:/phoenix"]
    networks: [copilot]

  tempo:
    image: grafana/tempo:2.5.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infra/observability/tempo.yaml:/etc/tempo.yaml
    ports: ["3200:3200"]
    networks: [copilot]

  loki:
    image: grafana/loki:3.2.0
    command: ["-config.file=/etc/loki.yaml"]
    volumes:
      - ./infra/observability/loki.yaml:/etc/loki.yaml
    ports: ["3100:3100"]
    networks: [copilot]

  mimir:
    image: grafana/mimir:2.13.0
    command: ["-config.file=/etc/mimir.yaml"]
    volumes:
      - ./infra/observability/mimir.yaml:/etc/mimir.yaml
    ports: ["9009:9009"]
    networks: [copilot]

  grafana:
    image: grafana/grafana:11.1.0
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    networks: [copilot]

  prometheus:
    image: prom/prometheus:latest
    command: ["--config.file=/etc/prometheus.yaml"]
    volumes:
      - ./infra/observability/prometheus.yaml:/etc/prometheus.yaml
    ports: ["9090:9090"]
    networks: [copilot]

  vault:
    image: hashicorp/vault:1.17
    command: ["vault", "server", "-dev", "-dev-listen-address=0.0.0.0:8200"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: copilot-dev-token
    ports: ["8200:8200"]
    volumes: ["vaultdata:/vault/file"]
    networks: [copilot]

  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [copilot]

  api-gateway:
    build:
      context: .
      dockerfile: docker/api-gateway.Dockerfile
    ports: ["8080:8080"]
    environment:
      JWT_SECRET: dev-jwt-secret
    networks: [copilot]
    depends_on: [postgres, redis]

  tax-engine:
    build:
      context: .
      dockerfile: docker/tax-engine.Dockerfile
    ports: ["8000:8000"]
    networks: [copilot]
    depends_on: [postgres]

  mcp-server:
    build:
      context: .
      dockerfile: docker/mcp-server.Dockerfile
    ports: ["9000:9000"]
    networks: [copilot]
