syntax = "proto3";

package copilot.ledger.v1;

option go_package = "github.com/quantumworld-dpdns-io/ledger/internal/proto;ledgerv1";

service Ledger {
  rpc Append(AppendRequest) returns (AppendResponse);
  rpc Balance(BalanceRequest) returns (BalanceResponse);
  rpc History(HistoryRequest) returns (HistoryResponse);
  rpc Reconcile(ReconcileRequest) returns (ReconcileResponse);
}

message Entry {
  string id = 1;
  string creator_id = 2;
  string platform = 3;
  string currency = 4;
  int64  timestamp_ms = 5;
  string gross = 6;     // decimal as string
  string fees = 7;
  string net = 8;
  string hash = 9;      // BLAKE3
  string signature = 10; // Dilithium
}

message AppendRequest { Entry entry = 1; }
message AppendResponse { bool ok = 1; string error = 2; string hash = 3; }

message BalanceRequest {
  string creator_id = 1;
  string currency = 2;
  int64  as_of_ms = 3;
}
message BalanceResponse {
  string gross = 1;
  string fees = 2;
  string net = 3;
}

message HistoryRequest {
  string creator_id = 1;
  int64  start_ms = 2;
  int64  end_ms = 3;
  int32  limit = 4;
}
message HistoryResponse { repeated Entry entries = 1; }

message ReconcileRequest { string creator_id = 1; int64 period_end_ms = 2; }
message ReconcileResponse { bool ok = 1; string delta = 2; string error = 3; }
