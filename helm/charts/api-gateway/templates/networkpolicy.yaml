apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "copilot.fullname" . }}
spec:
  podSelector:
    matchLabels:
      {{- include "copilot.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - podSelector: {}
      ports:
        - port: 8080
          protocol: TCP
        - port: 443
          protocol: TCP
        - port: 5432
          protocol: TCP
