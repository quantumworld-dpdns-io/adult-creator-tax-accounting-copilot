apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "copilot.fullname" . }}
  labels:
    {{- include "copilot.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "copilot.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # PQC: enforce via Kyverno
        container.seccomp.security.alpha.kubernetes.io/api-gateway: "runtime/default"
        # Trivy/SBOM annotation
        seccomp.security.alpha.kubernetes.io/pod: "runtime/default"
      labels:
        {{- include "copilot.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "copilot.fullname" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api-gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            {{- toYaml .Values.env | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /livez
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
