name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.0.0)"
        required: false
        default: "auto"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  deployments: write
  pages: write
  issues: write
  pull-requests: write
  security-events: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: go
          package-name: adult-creator-tax-copilot
          changelog-path: CHANGELOG.md
          include-component-in-tag: true

  build-publish:
    needs: release-please
    if: needs.release-please.outputs.release_created
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        service: [api-gateway, tax-engine, ledger, crypto-tax, realtime-pricing, kyc, mcp-server, webhook-router, notification]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Determine dockerfile
        id: df
        run: |
          case "${{ matrix.service }}" in
            api-gateway|ledger|kyc|realtime-pricing|crypto-tax) echo "dockerfile=docker/Dockerfile.go" >> $GITHUB_OUTPUT ;;
            mcp-server|webhook-router|notification) echo "dockerfile=docker/Dockerfile.node" >> $GITHUB_OUTPUT ;;
            tax-engine) echo "dockerfile=docker/Dockerfile.python" >> $GITHUB_OUTPUT ;;
          esac
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.df.outputs.dockerfile }}
          push: true
          tags: |
            ghcr.io/quantumworld-dpdns-io/${{ matrix.service }}:${{ needs.release-please.outputs.tag_name }}
            ghcr.io/quantumworld-dpdns-io/${{ matrix.service }}:latest
          provenance: true
          sbom: true
      - name: Cosign sign
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          cosign sign --yes ghcr.io/quantumworld-dpdns-io/${{ matrix.service }}@${{ steps.build.outputs.digest }}

  helm-publish:
    needs: release-please
    if: needs.release-please.outputs.release_created
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v4
        with: { version: v3.16.0 }
      - name: Package
        run: |
          helm dependency update helm/
          helm package helm/ -d helm/dist/
      - name: Configure GH Pages
        uses: actions/configure-pages@v4
      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: helm/dist/

  sdk-publish:
    needs: release-please
    if: needs.release-please.outputs.release_created
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sdk: [ts, py, go, rust, java]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
        if: matrix.sdk == 'ts'
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
        if: matrix.sdk == 'py'
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
        if: matrix.sdk == 'go'
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.sdk == 'rust'
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '21' }
        if: matrix.sdk == 'java'
      - name: Generate SDK
        run: docker run --rm -v $PWD:/out openapitools/openapi-generator-cli generate -i openapi/openapi.yaml -g ${{ matrix.sdk }} -o /out/sdk-${{ matrix.sdk }}
      - name: Publish
        run: echo "publish step for ${{ matrix.sdk }} SDK"
        # In production: publish to npm / PyPI / crates.io / Maven Central

  deploy-zeabur:
    needs: [release-please, build-publish]
    if: needs.release-please.outputs.release_created
    runs-on: ubuntu-latest
    environment: zeabur-prod
    steps:
      - uses: actions/checkout@v6
      - name: Trigger Zeabur deploy
        run: |
          curl -fsSL -X POST https://api.zeabur.com/hooks/deploy \
            -H "Authorization: Bearer ${{ secrets.ZEABUR_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"project":"copilot-prod","tag":"${{ needs.release-please.outputs.tag_name }}"}'

  deploy-northflank:
    needs: [release-please, build-publish]
    if: needs.release-please.outputs.release_created
    runs-on: ubuntu-latest
    environment: northflank-prod
    steps:
      - name: Trigger Northflank deploy
        run: |
          curl -fsSL -X POST https://api.northflank.com/v1/... \
            -H "Authorization: Bearer ${{ secrets.NORTHFLANK_TOKEN }}"

  deploy-scaleway:
    needs: [release-please, build-publish]
    if: needs.release-please.outputs.release_created
    runs-on: ubuntu-latest
    environment: scaleway-prod
    steps:
      - uses: actions/checkout@v6
      - uses: pulumi/setup-pulumi@v2
        with: { version: 3.140.0 }
      - run: pulumi login --local
      - run: cd infra/pulumi/scaleway && pulumi up --yes --stack prod

  deploy-exoscale:
    needs: [release-please, build-publish]
    if: needs.release-please.outputs.release_created
    runs-on: ubuntu-latest
    environment: exoscale-prod
    steps:
      - uses: actions/checkout@v6
      - uses: pulumi/setup-pulumi@v2
        with: { version: 3.140.0 }
      - run: cd infra/pulumi/exoscale && pulumi up --yes --stack prod

  announce:
    needs: release-please
    if: needs.release-please.outputs.release_created
    runs-on: ubuntu-latest
    steps:
      - name: Discord
        run: |
          curl -fsSL -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d '{"content":"Released ${{ needs.release-please.outputs.tag_name }} 🚀"}'
      - name: Slack
        run: |
          curl -fsSL -X POST "${{ secrets.SLACK_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d '{"text":"Released ${{ needs.release-please.outputs.tag_name }}"}'
